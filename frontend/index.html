<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SAFEHOLD</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >
</head>

<body>

    <main class="welcome-page">

        <section class="welcome-card">

            <div class="brand-mark">
                SH
            </div>

            <p class="eyebrow">
                SAFEHOLD
            </p>

            <h1>
                Help without putting yourself at greater risk.
            </h1>

            <p class="welcome-text">
                A private space to find support, document
                what happened, and explore safer next steps.
            </p>

            <div class="welcome-actions">

                <a
                    class="button button-primary"
                    href="pages/login.html"
                >
                    Continue
                </a>

                <a
                    class="text-link"
                    href="pages/emergency.html"
                >
                    I need help right now
                </a>

            </div>

            <p class="privacy-note">
                SAFEHOLD helps you make informed choices.
                It does not decide for you.
            </p>

        </section>

    </main>

</body>
</html>
